<!doctype html>
<html lang="en-IN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 · Page Not Found · SanjanaIAS</title>
    <link rel="icon" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('sanjana.theme');
                if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <style>
        .error-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .error-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .error-card {
            max-width: 520px;
            text-align: center;
            padding: 50px 24px;
            margin: 0;
        }

        .error-title {
            font-size: 6rem;
            color: var(--gold);
            margin: 0 0 16px;
            line-height: 1;
            font-family: var(--serif);
            font-weight: 800;
        }

        /* --- NEW BETTER BUTTON LAYOUT --- */
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .error-actions .btn {
            padding: 12px 24px;
            font-size: 0.95rem;
            flex: 1;
            /* Makes buttons equal width */
        }

        /* Stack buttons on mobile for better touch targets */
        @media (max-width: 480px) {
            .error-actions {
                flex-direction: column;
                gap: 10px;
            }

            .error-actions .btn {
                width: 100%;
                padding: 14px 20px;
                /* Bigger tap area */
            }
        }
    </style>
</head>

<body>
    <div class="error-layout">
        <header class="site-header"
            style="justify-content: center; padding: 16px; background: transparent; border-bottom: none;">
            <a class="brand" href="/">
                <img src="/logo.png" alt="SanjanaIAS Logo" width="32" height="32"
                    style="border-radius: 8px; object-fit: cover;">
                <span class="brand-text"><strong>SanjanaIAS</strong><em>Study Intelligence</em></span>
            </a>
        </header>

        <main class="error-main">
            <div class="panel error-card">
                <h1 class="error-title">404</h1>
                <h2 style="margin-top: 0; font-size: 1.5rem;">Page not found</h2>
                <p class="fine" style="margin-bottom: 0; font-size: 1rem; line-height: 1.6;">
                    The page you are looking for does not exist, has been moved, or is temporarily unavailable.
                </p>

                <div class="error-actions">
                    <a class="btn btn-primary" href="/dashboard">Go to Overview</a>
                    <a class="btn" href="/ai-tutor">Ask Sanjana AI</a>
                </div>
            </div>
        </main>
    </div>
</body>
