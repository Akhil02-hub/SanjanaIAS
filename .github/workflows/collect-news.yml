name: Collect news

"on":
  schedule:
    # Runs automatically every day at 4:30 AM IST (11:00 PM UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run collector
        run: node scripts/collect-news.js

      - name: Validate generated data
        run: |
          node -e "
          const fs = require('fs');
          const p = 'data/news.json';
          if (!fs.existsSync(p)) {
            console.error('❌ news.json missing');
            process.exit(1);
          }
          try {
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!Array.isArray(d.topics)) {
              console.error('❌ topics is not an array');
              process.exit(1);
            }
            const bad = d.topics.filter(t => !t.id || !t.title || !t.region);
            if (bad.length) {
              console.error('❌ Malformed topics found:', bad.length);
              bad.forEach(t => console.error('   - Missing fields:', t.title || 'NO TITLE'));
              process.exit(1);
            }
            console.log('✅ Validated', d.topics.length, 'topics.');
          } catch (e) {
            console.error('❌ Invalid JSON:', e.message);
            process.exit(1);
          }
          "

      - name: Commit changes
        run: |
          git config user.name "akhil02-hub"
          git config user.email "amarachinthaakhil@gmail.com"
          date > last_run.txt
          git add last_run.txt data/news.json sitemap-articles.xml
          git commit -m "Daily update and keep-alive"
          git pull --rebase
          git push